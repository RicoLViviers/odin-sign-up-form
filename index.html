<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up form</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap');
    </style>
</head>

<body>
    <div id="container">
        <img src="assets/airport.jpg" alt="Image of airport" width="400" id="plane-image">
        <form action="/submit" method="POST" class="form-container">
            <p class="subtext">Join us and get ready for your next journey.</p>
            <p class="main-text">Create your account.</p>

            <input type="text" placeholder="First name">
            <input type="text" placeholder="Last name">
            
            <input type="email" placeholder="Email">
            <input type="tel" placeholder="Phone number">

            <input id="password" type="password" placeholder="Password">
            <input id="confirm-password" type="password" placeholder="Confirm Password">

            <button type="submit">Submit</button>
        </form>
    </div>
    <script src="script.js"></script>
</body>

</html>
